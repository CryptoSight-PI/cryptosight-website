<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/cadstyle.css">
  <link rel="icon" href="../assets/imgs/logo.png">
  <title>Cadastro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>

<body onload="listar()">
  <div class="quadrados">
    <div class="union">
      <img src="../assets/imgs/Union.png" alt="" class="union-normal">
      <img src="../assets/imgs/union-bright.png" alt="" class="union-bright">
    </div>

  </div>
  <main id="gira">
    <div class="esquerda">
      <div class="seta" onclick="history.back()">
        <img src="../assets/imgs/seta.png" alt="">
      </div>
      <div class="logo" onclick="virar()">
        <img src="../assets/imgs/logo.png" alt=""
          class="icone">
        <div class="crypto">CryptoSight</div>
      </div>
    </div>
      <div class="direita">
        <div class="titulo" id="titulo">Cadastre sua Empresa</div>
        <div class="form">

          <label class="campos esq">
            <span class="campo">Razão social:</span>
            <input id="razaoSocial_input" type="text" placeholder="Ex.: CryptoSight Tecnologia LTDA" />
          </label>
          <label class="campos dir">
            <span class="campo">Telefone:</span>
            <input id="telefone_input" type="text" placeholder="Digite o telefone da empresa" />
          </label>
          <label class="campos dir">
            <span class="campo">E-mail:</span>
            <input type="email" id="email_input" placeholder="Digite seu email..">
          </label>
          <label class="campos esq">
            <span class="campo">Nome fantasia:</span>
            <input id="nomeFantasia_input" type="text" placeholder="Ex.: CryptoSight" />
          </label>
          <label class="campos esq">
            <span class="campo">CNPJ:</span>
            <input id="cnpj_input" type="text" placeholder="Digite o CNPJ da empresa" />
          </label>
          <label class="campos esq">
            <span class="campo">Senha:</span>
            <input type="password" id="senha_input" placeholder="Digite sua senha..">
          </label>
          <label class="campos dir">
            <span class="campo">Confirmar senha:</span>
            <input type="password" id="confirmacao_senha_input" placeholder="Digite sua senha..">
          </label>
          <label class="campos dir">
            <span class="campo">Cep:</span>
           <input id="cep_input" type="text" placeholder="Digite o CEP" oninput="cepAtivo()" maxlength="8" />
           </label>
            <label class="campos dir">
              <span class="campo">Estado:</span>
              <select id="uf_input">
                <option value="" disabled selected hidden>Selecione</option>
              </select>
            </label>
            <label class="campos dir">
            <span class="campo">Cidade:</span>
            <input id="cidade_input" type="text" placeholder="Digite a Cidade" />
          </label>
          <label class="campos dir">
            <span class="campo">Bairro:</span>
            <input id="bairro_input" type="text" placeholder="Digite o Bairro" />
          </label>
          <label class="campos dir">
            <span class="campo">Logadouro:</span>
            <input id="logradouro_input" type="text" placeholder="Digite o Logradouro" />
          </label>
          <label class="campos dir">
            <span class="campo">Número:</span>
             <input id="numero_input" type="text" placeholder="Digite o número" />
          </label>
          <label class="campos dir">
            <span class="campo">Complemento:</span>
            <input id="complemento_input" type="text" placeholder="Opcional" />
          </label>
          <div class="conta">Já possui uma <a href="loginEmpresa.html">conta</a>?</div>
          <button class="submit" onclick="cadastrarEmpresa()">CADASTRAR</button>
        </div>
      </div>
    </main>
</body>

</html>

<script src="../js/animations.js"></script>
<script>

  function listar() {
    fetch("/ufs/listarEstados", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((ufs) => {
          ufs.forEach((uf) => {
            uf_input.innerHTML += `<option value="${uf.id}">${uf.sigla}</option>`;
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

 function cepAtivo() {
    let cep = cep_input.value.replace(/\D/g, '');

    if (cep.length === 8) {
      fetch(`https://viacep.com.br/ws/${cep}/json/`)
        .then(response => response.json())
        .then(data => {
          if (!('erro' in data)) {
            document.getElementById('logradouro_input').value = data.logradouro;
            document.getElementById('bairro_input').value = data.bairro;
            document.getElementById('cidade_input').value = data.localidade;

        
            let selectUf = document.getElementById('uf_input');
            for (let i = 0; i < selectUf.options.length; i++) {
          
              if (selectUf.options[i].text.includes(data.uf)) {
                selectUf.selectedIndex = i;
                break;
              }
            }
          } else {
            alert("CEP não encontrado.");
          }
        })
        .catch(error => {
          console.log("Erro ao buscar CEP:", error);
        });
    }
  }

  function cadastrarEmpresa() {
    var razaoSocialVar = razaoSocial_input.value;
    var telefoneVar = telefone_input.value;
    var emailVar = email_input.value;
    var nomeFantasiaVar = nomeFantasia_input.value;
    var cnpjVar = cnpj_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    var cepVar = cep_input.value;
    var ufVar = uf_input.value; 
    var cidadeVar = cidade_input.value;
    var bairroVar = bairro_input.value;
    var logradouroVar = logradouro_input.value;
    var numeroVar = numero_input.value;
    var complementoVar = complemento_input.value;
    var sedeVar = 1;

    let indice_ponto_com = emailVar.indexOf(".com");
    let indice_arroba = emailVar.indexOf("@");
    let arroba_antes_ponto_com = indice_arroba < indice_ponto_com - 1;
    let termina_em_ponto_com = emailVar.endsWith(".com");

    console.log("Validador iniciado...");
    console.log("UF selecionada (ID):", ufVar);

    if (
      razaoSocialVar.trim() == "" ||
      telefoneVar.trim() == "" ||
      emailVar.trim() == "" ||
      nomeFantasiaVar.trim() == "" ||
      cnpjVar.trim() == "" ||
      senhaVar.trim() == "" ||
      confirmacaoSenhaVar.trim() == "" ||
      cepVar.trim() == "" ||
      ufVar == "" ||
      cidadeVar.trim() == "" ||
      bairroVar.trim() == "" ||
      logradouroVar.trim() == "" ||
      numeroVar.trim() == ""
    ) {
      console.log("ERRO: Há campos em branco!");
      alert("Preencha todos os campos obrigatórios!");
      return;
     } else if (telefoneVar.length != 11 || isNaN(telefoneVar)) {
      console.log("ERRO: Telefone inválido");
      return;
    } else if (!(arroba_antes_ponto_com && indice_arroba > -1 && indice_ponto_com > -1 && termina_em_ponto_com)) {
      console.log("ERRO: Email inválido");
      return;
    } else if (cnpjVar.length != 14 || isNaN(cnpjVar)) {
      console.log("ERRO: CNPJ inválido (precisa ter 14 números sem pontos/traços)");
      return;
    } else if (senhaVar.length < 6) {
      console.log("ERRO: Senha curta");
      return;
    } else if (senhaVar != confirmacaoSenhaVar) {
      console.log("ERRO: Senhas não conferem");
      return;
    } else if (cepVar.length != 8 || isNaN(cepVar)) {
      console.log("ERRO: CEP inválido");
      return;
    }

    console.log("Validações passaram! Enviando fetch para o back-end...");


    fetch("/empresas/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        razaoSocial: razaoSocialVar,
        telefone: telefoneVar,
        email: emailVar,
        nomeFantasia: nomeFantasiaVar,
        cnpj: cnpjVar,
        senha: senhaVar,
        cep: cepVar,
        uf: ufVar,
        cidade: cidadeVar,
        bairro: bairroVar,
        logradouro: logradouroVar,
        numero: numeroVar,
        complemento: complementoVar,
        sede: sedeVar
      }),
    })
      .then(function (resposta) {
        console.log("Resposta recebida do servidor: ", resposta);

          if (resposta.ok) {
               resposta.json().then(function (dados) {
              sessionStorage.ID_EMPRESA = dados.idEmpresa;
              setTimeout(() => {
                window.location = "cadastroAdmin.html";
              }, 2000);
          });
          
        } 
         else {
          return resposta.json().then(function (dados) {
            console.log("Erro retornado pela API:", dados);
          });
        }
      })
      .catch(function (erro) {
        console.log(`#ERRO NA REQUISIÇÃO: ${erro}`);
      });

    return false;
  }
  function listar() {
    fetch("/ufs/listarEstados", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((ufs) => {
          ufs.forEach((uf) => {

            uf_input.innerHTML += ` <option value="${uf.id}">${uf.nome} - ${uf.sigla}</option>`;

          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    // cardErro.style.display = "none";
  }
</script>
