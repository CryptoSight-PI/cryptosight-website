<script>
    var idEmpresa = sessionStorage.ID_EMPRESA 

    function abrirFarms(){
        let pid = document.getElementById("lista_farms")
        pid.innerHTML = ""
        fetch(`/farms/list/${idEmpresa}`).then(resposta => 
        resposta.json()).then(farms => {
                for (let i = 0; i < farms.length; i++){
                    pid.innerHTML += `
                        <div>
                            <p onclick="abrirSessoes(${farms[i].id})" class="cursor-pointer py-1 hover:text-[#00E6A6]">${farms[i].nome}</p>
                            <div id="sessoes_${farms[i].id}" class="ml-4"></div>
                        </div>`
                }
            })
    }

    function abrirSessoes(idFarm){
        let pid = document.getElementById("sessoes_" + idFarm)
        pid.innerHTML = ""
        fetch(`/sessoes/listar/${idFarm}`).then(resposta => 
        resposta.json()).then(sessoes => {
                for (let i = 0; i < sessoes.length; i++){
                    pid.innerHTML += `
                        <div>
                            <p onclick="abrirRigs(${sessoes[i].id} , ${idFarm})" class="cursor-pointer py-1 hover:text-[#00E6A6]">${sessoes[i].nome}</p>
                            <div id="rigs_${sessoes[i].id}" class="ml-4"></div>
                        </div>`
                }
            })
    }

    function abrirRigs(idSessao , idFarm){
        let pid = document.getElementById("rigs_" + idSessao)
        pid.innerHTML = ""
        fetch(`/dispositivos/listar/${idSessao}`).then(resposta => 
        resposta.json()).then(dados => {
                for (let i = 0; i < dados.length; i++){
                    pid.innerHTML += `<p onclick="abrirRig(${dados[i].id}, ${idSessao} , ${idFarm})" class="cursor-pointer py-1 hover:text-[#00E6A6]">Rig-${dados[i].id}</p>`
                }
            })
    }

    function abrirRig(idrig, idsessao , idFarm){
        window.location.href = `../dash-analista/maquinas.html?id=${idrig}&farm=${idFarm}&sessao=${idsessao}`
    }

</script>
