<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/imgs/logo.png">
    <link rel="stylesheet" href="../css/output.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>Dashboard</title>
    

</head>

<body class="h-screen w-screen pl-20 bg-linear-135 from-[#0d1412] via-[#09483f] to-[#0d1412]">
    <dialog class="bg-[#0C1F19] flex flex-col group h-screen w-20 hover:w-70 transition-all duration-300 ease-in-out pt-5 z-99 overflow-hidden border-r border-[#207F70]" popover="hint" open>
        <img src="../assets/imgs/logo.png" class="self-center-safe justify-self-center-safe h-15">
        <div class="rounded-2xl flex flex-row pl-2 pr-2 pt-3 pb-3 ml-3 mr-2 mt-15 mb-2 hover:cursor-pointer w-13 group-hover:w-64 transition-all duration-300 ease-out bg-[#144840]">
            <img src="../assets/icones-dash/geral-verde.svg" class="h-7">
            <p class="hidden group-hover:block text-[#00E6A6] justify-center self-center ml-3 text-nowrap font-ibm font-semibold">Visão Geral</p>
        </div>
        <div class="rounded-2xl flex flex-row pl-2 pr-2 pt-3 pb-3 ml-3 w-13 hover:cursor-pointer">
            <img src="../assets/icones-dash/maquinas.svg" class="h-7">
            <p class="hidden group-hover:block text-[#A0B5AC] justify-center self-center ml-3 font-ibm">Máquinas</p>
        </div>
        <div class="rounded-2xl flex flex-row pl-2 pr-2 pt-3 pb-3 ml-3 w-13 hover:cursor-pointer">
            <img src="../assets/icones-dash/alertas.svg" class="h-7">
            <p class="hidden group-hover:block text-[#A0B5AC] justify-center self-center ml-3 font-ibm">Alertas</p>
        </div>
        <div class="absolute rounded-2xl flex flex-row pl-2 pr-2 pt-3 pb-3 ml-3 w-13 hover:cursor-pointer bottom-3">
            <img src="../assets/icones-dash/sair.svg" class="h-7">
            <p class="hidden group-hover:block text-[#A0B5AC] justify-center self-center ml-3 font-ibm">Logout</p>
        </div>
    </dialog>
</body>

</html>
