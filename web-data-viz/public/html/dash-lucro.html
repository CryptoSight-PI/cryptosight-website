<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/output.css">
    <title>Document</title>
</head>
<body class="h-screen w-screen pl-15 bg-linear-135 from-[#0d1412] via-[#09483f] to-[#0d1412] text-white bg-fixed overflow-x-hidden">
        <!-- Navbar -->
    <dialog class="bg-[#0C1F19] flex flex-col group h-screen w-15 hover:w-70 transition-all duration-300 ease-in-out pt-5 z-99 overflow-hidden border-r border-[#207F70]" popover="hint" open>
        <img src="../assets/imgs/logo.png" class="absolute self-center-safe justify-self-center-safe h-10 group-hover:h-15 transition-all duration-300 ease-in-out">

        <a href="dashboard-financeira.html">
        <div class="rounded-2xl flex flex-row pl-2 pr-2 pt-3 pb-3 ml-2 mr-2 mt-30 mb-2 hover:cursor-pointer w-10.5 group-hover:w-64 transition-all duration-300 ease-out bg-[#144840]">
            <img src="../assets/icones-dash/dashboard-plus-verde.svg" class="h-6">
            <p class="hidden group-hover:block text-[#00E6A6] justify-center self-center text-sm ml-3 text-nowrap font-inter font-semibold">Dashboard</p>
        </div>
        </a>
        <a href="farm.html">
        <div class="rounded-2xl flex flex-row pl-2 pr-2 pt-3 pb-3 ml-2 w-13 hover:cursor-pointer">
            <img src="../assets/icones-dash/farm-icon.svg" class="h-6">
            <p class="hidden group-hover:block text-[#A0B5AC] justify-center self-center text-sm ml-3 text-nowrap font-inter font-semibold">Gerenciar Farms</p>
        </div>
        </a>
        <a href="dispositivos.html">
        <div class="rounded-2xl flex flex-row pl-2 pr-2 pt-3 pb-3 ml-2 w-13 hover:cursor-pointer">
            <img src="../assets/icones-dash/server-plus1.svg" class="h-6">
            <p class="hidden group-hover:block text-[#A0B5AC] justify-center self-center text-sm ml-3 text-nowrap font-inter font-semibold">Gerenciar Máquinas</p>
        </div>
        </a>
        <a href="user-register.html">
        <div class="rounded-2xl flex flex-row pl-2 pr-2 pt-3 pb-3 ml-2 w-13 hover:cursor-pointer">
            <img src="../assets/icones-dash/user-icon.svg" class="h-6">
            <p class="hidden group-hover:block text-[#A0B5AC] justify-center self-center text-sm ml-3 text-nowrap font-inter font-semibold">Gerenciar Usuários</p>
        </div>
        </a>

        <a href="../index.html">
        <div class="absolute rounded-2xl flex flex-row pl-2 pr-2 pt-3 pb-3 ml-3 w-13 hover:cursor-pointer bottom-3">
            <img src="../assets/icones-dash/sair.svg" class="h-6">
            <p class="hidden group-hover:block text-[#A0B5AC] justify-center self-center text-sm ml-3 text-nowrap font-inter font-semibold">Logout</p>
        </div>
        </a>
    </dialog>

    <div class="border-b border-[#207F70] flex flex-row justify-between p-5 pl-10 pr-15 place-content-center">
        <div class="flex flex-row gap-5">
            <div class="bg-[#207F70] rounded-2xl pl-4 pr-6 pt-3 pb-3 flex flex-row">
                <img src="../../assets/imgs/bitdeer-logo.svg" alt="">
                <p class="font-space-mono ml-3 font-semibold text-sm text-nowrap place-content-center">Bitdeer Technologies Group</p>
            </div>
            <button class="bg-transparent rounded-2xl border border-[#207F70] place-content-center flex flex-row pl-4 pr-4 pt-3 pb-3 hover:cursor-pointer hover:bg-[#00000025] transition-colors duration-100 ease-in-out">
                <img src="../../assets/imgs/download.svg" class="">
                <p class="font-space-mono ml-3 text-sm text-nowrap place-content-center">Exportar relatório financeiro</p>
            </button>
        </div>
        <div class="flex flex-row align-baseline">
            <p class="font-space-mono font-bold place-self-center mr-3 text-lg">Jeff Smith</p>
            <img src="../../assets/imgs/Jeff.png" class="rounded-4xl border border-[#207F70] p-0.5 h-15">
        </div>
    </div>

    <div class="grid grid-cols-3 ml-5 mr-5">
        <select class="bg-[#0C1F19] border-[#207F70] border rounded-2xl m-5 p-2">
            <option value="">Selecione uma Farm</option>
        </select>
        <div></div>
        <div class="bg-[#0C1F19] border-[#207F70] border rounded-2xl m-5 grid grid-cols-3 place-content-center">
            <span class="flex flex-row justify-center rounded-2xl filtro-selecionado border border-transparent p-1">7 dias</span>
            <span class="flex flex-row justify-center rounded-2xl border border-transparent p-1">30 dias</span>
            <span class="flex flex-row justify-center rounded-2xl border border-transparent p-1">90 dias</span>
        </div>
    </div>

    <div class="grid grid-cols-3 ml-5 mr-5 h-fit">
        <div class="bg-[#0C1F19] border-[#207F70] border rounded-2xl m-5 p-5">
            <p>Rendimento da Farm:</p>
            <p class="flex flex-row text-3xl text-white pr-1 font-bold font-ibm-mono">
                <img src="../assets/icones-dash/cima-bom.svg">
                <img src="../assets/icones-dash/baixo-ruim.svg" class="hidden">
                 R$<span>40.000,00</span></p>
        </div>
        <div class="bg-[#0C1F19] border-[#207F70] border rounded-2xl m-5 p-5">
            <p>Gasto com a Farm:</p>
            <p class="flex flex-row text-3xl text-white pr-1 font-bold font-ibm-mono">
                <img src="../assets/icones-dash/cima-ruim.svg">
                <img src="../assets/icones-dash/baixo-bom.svg" class="hidden">
                R$<span>20.000,00</span></p>
        </div>
        <div class="bg-[#0C1F19] border-[#207F70] border rounded-2xl m-5 p-5">
            <p>ROI da Farm:</p>
            <p class="flex flex-row text-3xl text-white pr-1 font-bold font-ibm-mono">
                <img src="../assets/icones-dash/cima-bom.svg" class="hidden">
                <img src="../assets/icones-dash/baixo-ruim.svg"> 
                R$<span>20.000,00</span></p>
        </div>
    </div>
</body>
</html>
