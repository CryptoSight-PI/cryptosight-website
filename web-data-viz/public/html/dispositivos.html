<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="../assets/imgs/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="pl-20 min-h-screen w-screen bg-linear-135 from-[#0d1412] via-[#09483f] to-[#0d1412] text-white">
    <main class="flex-1 p-10">
        <div class="flex justify-between mb-10">
            <i onclick="voltarfarm()" class="fa-solid fa-arrow-left-long cursor-pointer text-2xl"></i>
            <div class="justify-center items-center m-auto">
                
                <h1 id="pid" class="text-3xl font-bold text-white">Gerenciamento de dispositivos da sessão </h1>
                <p class="text-gray-400 text-sm m-auto flex justify-center">Cadastre e gerencie dispositivos dessa sessão</p>
            </div>
        </div>

         <div class="mb-8 flex justify-between">
            <input id="inputbusca" oninput="buscar()" type="text" placeholder="Pesquisar por dispositivo..." class="w-80 bg-[#0C1F19] text-white px-5 py-3 rounded-xl border border-[#207F70]">
            <button onclick="modal_adicionar_dispositivo.showModal()" class="bg-[#00E6A6] text-black font-bold px-6 py-3 rounded-xl hover:bg-[#00c992] cursor-pointer flex items-center gap-2">
                + Novo dispositivo
            </button>
        </div>
        

        <dialog id="modal_adicionar_dispositivo" class="w-full p-15 m-auto max-w-xl bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">
            <h2 class="text-2xl text-white font-bold pb-2">Novo Dispositivo</h2>
            <div>
                <label class="text-white">endereço mac</label>
                <input oninput="validarmac()" maxlength="17" placeholder="AA:BB:CC:DD:EE:FF" id="iptmacdispositivo" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Modelo</label>
                <input placeholder="AntimerS21" id="iptmodelodispositivo" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Fabricante</label>
                <input placeholder="Bitmain" id="iptfabricantedispositivo" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Tipo</label>
                <input placeholder="ASIC" id="ipttipodispositivo" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div class="flex justify-between">
                <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold" onclick="modal_adicionar_dispositivo.close() ; adicionardispositivo()">CADASTRAR</button>
                <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer transition-colors" onclick="modal_adicionar_dispositivo.close()">CANCELAR</button>
            </div>
            
        </dialog>


    </main>
</body>
</html>
<script>
    let sessao = new URLSearchParams(location.search).get('sessao')
    let idsessao = new URLSearchParams(location.search).get('id')
    console.log(idsessao)
    function nomessessao(){
        pid.innerHTML = `Gerenciamento de dispositivos da ${sessao}`
    }
    nomessessao()
    function voltarfarm(){
        window.location.href = 'farm.html'
    }

    function validarmac(){
        mac = iptmacdispositivo.value.replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        let m = "";
        for (let i = 0; i < mac.length; i++) {
            if (i > 0 && i % 2 === 0) {
                m += ":";
            }
            m += mac[i];
            }
       iptmacdispositivo.value = m;
    }

    function adicionardispositivo(){
        alert("Dispositivo adicionado")
    }

</script>
