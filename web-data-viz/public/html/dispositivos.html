<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="../assets/imgs/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="pl-20 min-h-screen w-screen bg-linear-135 from-[#0d1412] via-[#09483f] to-[#0d1412] text-white">
    <main class="flex-1 p-10">
        <div class="flex justify-between mb-10">
            <i onclick="voltarfarm()" class="fa-solid fa-arrow-left-long cursor-pointer text-2xl"></i>
            <div class="justify-center items-center m-auto">
                
                <h1 id="pid" class="text-3xl font-bold text-white">Gerenciamento de dispositivos da sessão </h1>
                <p class="text-gray-400 text-sm m-auto flex justify-center">Cadastre e gerencie dispositivos dessa sessão</p>
            </div>
        </div>

         <div class="mb-8 flex justify-between">
            <input id="inputbusca" oninput="buscar()" type="text" placeholder="Pesquisar por dispositivo..." class="w-80 bg-[#0C1F19] text-white px-5 py-3 rounded-xl border border-[#207F70]">
            <button onclick="modal_adicionar_dispositivo.showModal()" class="bg-[#00E6A6] text-black font-bold px-6 py-3 rounded-xl hover:bg-[#00c992] cursor-pointer flex items-center gap-2">
                + Novo dispositivo
            </button>
        </div>


        <div id="piddispositivos" class="flex flex-wrap gap-6">
           
        </div>




        <p id="vazio" class="hidden text-center text-[#A0B5AC] py-10">Nenhuma máquina encontrada</p>

        

        <dialog id="modal_adicionar_dispositivo" class="w-full p-15 m-auto max-w-xl bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">
            <h2 class="text-2xl text-white font-bold pb-2">Novo Dispositivo</h2>
            <div>
                <label class="text-white">endereço mac</label>
                <input oninput="validarmac()" maxlength="17" placeholder="AA:BB:CC:DD:EE:FF" id="iptmacdispositivo" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Modelo</label>
                <input placeholder="AntimerS21" id="iptmodelodispositivo" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Fabricante</label>
                <input placeholder="Bitmain" id="iptfabricantedispositivo" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Tipo</label>
                <input placeholder="ASIC" id="ipttipodispositivo" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div class="flex justify-between">
                <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold" onclick="adicionardispositivo()">CADASTRAR</button>
                <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer transition-colors" onclick="modal_adicionar_dispositivo.close()">CANCELAR</button>
            </div>
            
        </dialog>


        <dialog id="modal_excluir_dispositivo" class="m-auto max-w-xl p-5 bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">
            <div>
                <h1 class="font-bold text-white">Certeza que deseja excluir esse dispostivo?</h1>
                <div class="flex justify-between gap-4">
                    <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold" onclick="modal_excluir_dispositivo.close() ; excluirdispositivo()">EXCLUIR</button>
                    <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer" onclick="modal_excluir_dispositivo.close()">CANCELAR</button>
                </div>
            </div>
        </dialog>




        <dialog id="modal_excluir_componente" class="m-auto max-w-xl p-5 bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">
            <div>
                <h1 class="font-bold text-white">Certeza que deseja excluir esse componente?</h1>
                <div class="flex justify-between gap-4">
                    <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold" onclick="excluircomponente()">EXCLUIR</button>
                    <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer" onclick="modal_excluir_componente.close()">CANCELAR</button>
                </div>
            </div>
        </dialog>






         <dialog id="modal_editar_dispositivo" class="w-full p-15 m-auto max-w-xl bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">
            <h2 class="text-2xl text-white font-bold pb-2">Editar Dispositivo</h2>
            <div>
                <label class="text-white">endereço mac</label>
                <input oninput="validarmaceditado()" maxlength="17" placeholder="AA:BB:CC:DD:EE:FF" id="iptmacdispositivoeditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Modelo</label>
                <input placeholder="AntimerS21" id="iptmodelodispositivoeditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Fabricante</label>
                <input placeholder="Bitmain" id="iptfabricantedispositivoeditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Tipo</label>
                <input placeholder="ASIC" id="ipttipodispositivoeditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div class="flex justify-between">
                <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold" onclick="modal_editar_dispositivo.close() ; editardispositivo()">EDITAR</button>
                <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer transition-colors" onclick="modal_editar_dispositivo.close()">CANCELAR</button>
            </div>
            
        </dialog>




        <dialog id="modal_adicionar_componente" class="w-full p-15 m-auto max-w-xl bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">
            <h2 class="text-2xl text-white font-bold pb-2">Adicionar Componente</h2>
            <div>
                <label class="text-white">Componente</label>
                <select id="iptcomponentecomponente" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60"></select>
            </div>
            <div class="flex gap-6">
                 <div>
                    <label class="text-white">Limite Mínimo</label>
                    <input placeholder="60.0" id="iptcomponentelimmin" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
                </div>
                <div>
                    <label class="text-white">Limite Máximo</label>
                    <input placeholder="95.0" id="iptcomponentelimmax" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
                </div>
            </div>
           
            <div> 
                <label class="text-white">Monitorado</label> 
                <select id="iptcomponentemonitorado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
                    <option value="1" class="bg-[#0C1F19]">Monitorado</option>
                    <option value="0" class="bg-[#0C1F19]">Não Monitorado</option>
                </select>
            </div> 

             <div class="flex justify-between">
                <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold" onclick="adicionarcomponente()">CADASTRAR</button>
                <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer transition-colors" onclick="modal_adicionar_componente.close()">CANCELAR</button>
            </div>
        </dialog>




        <dialog id="modal_editar_componente" class="w-full p-15 m-auto max-w-xl bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">
            <h2 class="text-2xl text-white font-bold pb-2">Editar Componente</h2>
            <div>
                <label class="text-white">Componente</label>
                <input placeholder="CPU" id="iptcomponentecomponenteeditado" readonly class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>
            <div class="flex gap-6">
                 <div>
                    <label class="text-white">Limite Mínimo</label>
                    <input placeholder="60.0" id="iptcomponentelimmineditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
                </div>
                <div>
                    <label class="text-white">Limite Máximo</label>
                    <input placeholder="95.0" id="iptcomponentelimmaxeditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
                </div>
            </div>
           
            <div> 
                <label class="text-white">Monitorado</label> 
                <select id="iptcomponentemonitoradoeditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
                    <option value="1" class="bg-[#0C1F19]">Monitorado</option>
                    <option value="0" class="bg-[#0C1F19]">Não Monitorado</option>
                </select>
            </div> 

             <div class="flex justify-between">
                <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold" onclick="editarcomponente()">EDITAR</button>
                <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer transition-colors" onclick="modal_editar_componente.close()">CANCELAR</button>
            </div>
        </dialog>






    </main>
</body>
</html>
<script>
    let sessao = new URLSearchParams(location.search).get('sessao')
    let id_sessao = new URLSearchParams(location.search).get('id')
    console.log(id_sessao)
    function nomessessao(){
        pid.innerHTML = `Gerenciamento de dispositivos da ${sessao}`
    }
    nomessessao()

    function voltarfarm(){
        window.location.href = 'farm.html'
    }

    function listardispositivos() {
        fetch(`/dispositivos/listar/${id_sessao}`)
            .then(function (resposta) {
               if(resposta.ok){
                resposta.json().then((dispositivos) => {

                     piddispositivos.innerHTML = "";

                if (dispositivos.length == 0) {
                    vazio.style.display = "block";
                    return;
                }
                vazio.style.display = "none";

                for (let i = 0; i < dispositivos.length; i++) {
                    piddispositivos.innerHTML += `
                    <div class="dispositivo w-100 p-6 bg-[#0C1F19] border border-[#207F70] rounded-2xl flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center">
                                <h2 class="text-xl font-bold text-white">${dispositivos[i].modelo}</h2>
                            </div>
                            <p class="text-sm text-gray-400">MAC: ${dispositivos[i].mac_address}</p>
                            <p class="text-xs text-gray-400">${dispositivos[i].tipo}</p>
                            <p class="text-xs text-gray-400">${dispositivos[i].fabricante}</p>
                            <p class="text-xs text-gray-400">Criado em: ${dispositivos[i].criacao}</p>

                            <div class="pt-4 mb-4">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-[#00E6A6]">Componentes do dispositivo</span>
                                    <button onclick="mostrarmodaladicionarcomponente(${dispositivos[i].id})" class="text-xs bg-[#144840] hover:bg-[#1a5e54] text-[#00E6A6] px-2.5 py-1 rounded-lg cursor-pointer">
                                        + Novo componente
                                    </button>
                                </div>
                                <div id="componentes_${dispositivos[i].id}" class="flex flex-col gap-3 max-h-[180px] overflow-y-auto pr-2 scrollbar-thin scrollbar-thumb-[#207F70]">
                                    <p class="text-xs text-gray-400">Nenhum componente cadastrado</p>
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="mostrarmodaleditardispositivo('${dispositivos[i].mac_address}', '${dispositivos[i].modelo}', '${dispositivos[i].fabricante}', '${dispositivos[i].tipo}', ${dispositivos[i].id})" class="flex-1 py-2 rounded-lg bg-[#144840] border border-[#207F70]/40 hover:bg-[#1a5e54] text-[#00E6A6] text-xs cursor-pointer flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-pen-to-square"></i> Editar Dispositivo
                            </button>
                            <button onclick="mostrarmodalexcluirdispositivo(${dispositivos[i].id})" class="flex-1 py-2 rounded-lg bg-[#7A0015]/30 border border-[#E00027]/40 hover:bg-red-900/50 text-red-400 text-xs cursor-pointer flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-trash-can"></i> Excluir Dispositivo
                            </button>
                        </div>
                    </div>`;

                    listarcomponente(dispositivos[i].id)
                }

                })
               };
            }).catch((erro) => {
                console.log("Deu erro no listar")
            })
            
    }

    listardispositivos();

    function validarmac(){
        mac = iptmacdispositivo.value.replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        let m = "";
        for (let i = 0; i < mac.length; i++) {
            if (i > 0 && i % 2 === 0) {
                m += ":";
            }
            m += mac[i];
            }
       iptmacdispositivo.value = m;
    }

    function validarmaceditado(){
        let mac = iptmacdispositivoeditado.value.replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        let m = "";
        for (let i = 0; i < mac.length; i++) {
            if (i > 0 && i % 2 === 0) {
                m += ":";
            }
            m += mac[i];
        }
        iptmacdispositivoeditado.value = m;
    }

    function adicionardispositivo() {
        let mac = iptmacdispositivo.value.trim();
        let modelo = iptmodelodispositivo.value.trim();
        let fabricante = iptfabricantedispositivo.value.trim();
        let tipo = ipttipodispositivo.value.trim();

        if (mac.length !== 17 || modelo == "" || fabricante == "" || tipo == "") {
            alert("Preencha todos os campos corretamente (MAC com 17 caracteres).");
            return;
        }

        fetch(`/dispositivos/cadastrar/${id_sessao}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                mac_address: mac,
                modelo: modelo,
                fabricante: fabricante,
                tipo: tipo
            })
        })
        .then(function (resposta) {
            if (resposta.ok) {
                alert("Dispositivo cadastrado com sucesso!");
                modal_adicionar_dispositivo.close();
                iptmacdispositivo.value = "";
                iptmodelodispositivo.value = "";
                iptfabricantedispositivo.value = "";
                ipttipodispositivo.value = "";
                location.reload();
            } else {
                resposta.text().then(texto => alert("Erro ao cadastrar: " + texto));
            }
        })
        .catch(function (erro) {
            console.log(erro);
            alert("Erro de conexão com o servidor.");
        });
    }

     function buscar(){
            let texto = inputbusca.value.toLowerCase();
            let itens = document.querySelectorAll('.dispositivo');
            let visiveis = 0;

            for (let i = 0; i < itens.length; i++) {
                
                if (itens[i].textContent.toLowerCase().includes(texto)) {
                    itens[i].style.display = "";
                    visiveis++;
                } else {
                    itens[i].style.display = "none";
                }
            }
            vazio.style.display = visiveis > 0 ? "none" : "block";
        }


        function statusrig(id) {

            spandavez = document.getElementById(`status_rig_${id}`);
            if (spandavez.textContent === 'Monitorado') {
                spandavez.textContent = 'Não Monitorado';
                spandavez.className = 'bg-gray border border-black text-gray-400 px-3 py-1 rounded-lg text-xs';
            } else {
                spandavez.textContent = 'Monitorado';
                spandavez.className = 'bg-[#144840] text-[#00E6A6] px-3 py-1 rounded-lg text-xs';
            }
        }



        function mostrarmodaleditardispositivo(mac , modelo , fabricante , tipo , id){
            iptmacdispositivoeditado.value = mac;
            iptmodelodispositivoeditado.value = modelo;
            iptfabricantedispositivoeditado.value = fabricante;
            ipttipodispositivoeditado.value = tipo;

            iddispositivoeditado = id

            modal_editar_dispositivo.showModal()
        }

        
        let idcomponenteexcluido = null;

        function mostrarmodalexcluircomponente(id) {
            idcomponenteexcluido = id;
            console.log("ID do componente selecionado:", idcomponenteexcluido);

            modal_excluir_componente.showModal();
        }

        function excluircomponente() {
            fetch(`/dispositivos/excluircomponente/${idcomponenteexcluido}`, { method: "DELETE" })
            .then((resposta) => {
                if (resposta.ok) {
                    alert("componente excluido");
                    modal_excluir_componente.close()
                    listardispositivos();
                } 
            })
            .catch((erro) =>  {
                alert("Erro excluir");
            });
        
        }



        let iddispositivodeletado = null
        function mostrarmodalexcluirdispositivo(id){
            iddispositivodeletado = id
            modal_excluir_dispositivo.showModal()
        }


        function excluirdispositivo() {
            fetch(`/dispositivos/excluir/${iddispositivodeletado}`, { method: "DELETE" })
            .then((resposta) => {
                if (resposta.ok) {
                    alert("dispositivo excluido");
                    listardispositivos();
                } 
            })
            .catch((erro) =>  {
                alert("Erro excluir");
            });
        }

        function editardispositivo(){
            let mac = iptmacdispositivoeditado.value.trim();
            let modelo = iptmodelodispositivoeditado.value.trim();
            let fabricante = iptfabricantedispositivoeditado.value.trim();
            let tipo = ipttipodispositivoeditado.value.trim();

            if (mac.length !== 17 || modelo == "" || fabricante == "" || tipo == "") {
                alert("Preencha todos os campos corretamente (MAC com 17 caracteres).");
                return;
            }

            fetch(`/dispositivos/atualizar/${iddispositivoeditado}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    mac_address: mac,
                    modelo: modelo,
                    fabricante: fabricante,
                    tipo: tipo
                })
            }).then((resposta) => {
                if (resposta.ok) {
                    alert("dispositivo atualizado");
                    listardispositivos()
                } else {
                    resposta.text().then(texto => alert("Erro ao editar: " + texto));
                }
            }).catch((erro) => {
                console.log(erro);
                alert("erro editar")
            })
        }


        function catalogocomponente(){
            fetch(`/dispositivos/catalogocomponente`)
                .then((resposta) => {
                    if (resposta.ok) {
                        resposta.json().then((catalogo) => {
                            iptcomponentecomponente.innerHTML = "";
                            for (let i = 0; i < catalogo.length; i++) {
                                iptcomponentecomponente.innerHTML += `<option value="${catalogo[i].id}" class="bg-[#0C1F19]">${catalogo[i].nome}</option>`;
                            }
                        });
                    }
                })
                .catch((erro) => {
                    console.log(erro);
            });
        }

        catalogocomponente()

        iddispositivocomponente = null
        function mostrarmodaladicionarcomponente(id) {
            iddispositivocomponente = id;
            modal_adicionar_componente.showModal();
        }


        function adicionarcomponente() {
            let idcomponente = iptcomponentecomponente.value.trim();
            let limmin = iptcomponentelimmin.value.trim();
            let limmax = iptcomponentelimmax.value.trim();
            let monitorado = iptcomponentemonitorado.value.trim();

            if (idcomponente == "" || limmin == "" || limmax == "") {
                alert("Preencha todos os campos.");
                return;
            }

            fetch(`/dispositivos/cadastrarcomponente/${iddispositivocomponente}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    idcomponente: idcomponente,
                    limmin: limmin,
                    limmax: limmax,
                    monitorado: monitorado
                })
            })
            .then(function (resposta) {
                if (resposta.ok) {
                    alert("componente cadastrado com sucesso!");
                    modal_adicionar_componente.close();
                    iptcomponentelimmin.value = "";
                    iptcomponentelimmax.value = "";
                    listardispositivos();
                } else {
                    resposta.text().then(texto => alert("Erro ao cadastrar: " + texto));
                }
            })
            .catch(function (erro) {
                console.log(erro);
                alert("Erro de conexão com o servidor.");
            });
        }

        function listarcomponente(iddispositivocomponente){
            fetch(`/dispositivos/listarcomponente/${iddispositivocomponente}`).then((resposta) => {
                if(resposta.ok){
                    resposta.json().then((resposta) => {
                        spancomponente = document.getElementById(`componentes_${iddispositivocomponente}`);
                        spancomponente.innerHTML = ""
                        for(let i = 0 ; i < resposta.length ; i++){
                            let statusTexto = resposta[i].monitorado == 1 ? "Monitorado" : "Não Monitorado";
                            let statusCor = resposta[i].monitorado == 1 ? "text-[#00E6A6] bg-[#144840]" : "text-gray-400 bg-gray-800";

                            spancomponente.innerHTML += `
                                <div class="bg-[#101b18] p-2.5 rounded-xl border border-[#207F70]/40 flex justify-between items-center text-xs">
                                    <div>
                                        <p class="font-bold text-white">${resposta[i].nome} - ${resposta[i].id}</p>
                                        <p class="text-gray-400">Min: ${resposta[i].limite_min} | Máx: ${resposta[i].limite_max}</p>
                                        <button onclick="switchmonitorado(${resposta[i].id})" class="cursor-pointer inline-block px-2 py-0.5 rounded text-[10px] mt-1 ${statusCor}">${statusTexto}</button>
                                    </div>
                                    <div class="flex gap-1.5">
                                        <button onclick="mostrarmodaleditarcomponente('${resposta[i].nome}', ${resposta[i].limite_min}, ${resposta[i].limite_max}, ${resposta[i].monitorado}, ${resposta[i].id})" class="p-1.5 bg-[#144840] hover:bg-[#1a5e54] text-[#00E6A6] rounded cursor-pointer">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                        <button onclick="mostrarmodalexcluircomponente(${resposta[i].id})" class="p-1.5 bg-red-900/30 hover:bg-red-900/50 text-red-400 rounded cursor-pointer">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                            
                        }
                    })

                }
            }).catch((erro) => {
                console.log(erro)
                alert("erro no listar do componente")
            })
        }

        
        function switchmonitorado(idcomponente){
            fetch(`/dispositivos/vermonitorado/${idcomponente}`).then((resposta) => {
                if(resposta.ok){
                    resposta.json().then((dado) => {
                        if(dado.length > 0){
                            if(dado[0].monitorado == 1){
                                fetch(`/dispositivos/switchnaomonitorado/${idcomponente}`, {
                                    method: "PUT",
                                    headers: { "Content-Type": "application/json" },
                                })
                                .then((resposta1) => {
                                    if(resposta1.ok){
                                        listardispositivos();
                                    }
                                }).catch((erro) => {
                                    console.log(erro);
                                });

                            }else{
                                fetch(`/dispositivos/switchmonitorado/${idcomponente}`, {
                                    method: "PUT",
                                    headers: { "Content-Type": "application/json" },
                                })
                                .then((resposta2) => {
                                    if(resposta2.ok){
                                        listardispositivos();
                                    }
                                }).catch((erro) => {
                                    console.log(erro);
                                });
                            }
                        }
                    });
                }
            }).catch((erro) => {
                console.log(erro);
            });
        }

        let idcomponenteeditado = null;

        function mostrarmodaleditarcomponente(nome , min , max , monitorado , id){
            iptcomponentecomponenteeditado.value = nome
            iptcomponentelimmineditado.value = min
            iptcomponentelimmaxeditado.value = max
            iptcomponentemonitoradoeditado.value = String(monitorado)


            idcomponenteeditado = id

            modal_editar_componente.showModal()

        }


        function editarcomponente(){
            let limmineditado = iptcomponentelimmineditado.value.trim();
            let limmaxeditado = iptcomponentelimmaxeditado.value.trim();
            let monitoradoeditado = iptcomponentemonitoradoeditado.value.trim();
            
            fetch(`/dispositivos/editarcomponente/${idcomponenteeditado}` , {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    limmin: Number(limmineditado),
                    limmax: Number(limmaxeditado),
                    monitorado: Number(monitoradoeditado)
                })
            }).then((resposta) => {
                if(resposta.ok) {
                    resposta.json().then((dados) => {
                        alert("componente editado")
                        modal_editar_componente.close()
                        listardispositivos()
                    })
                }
            }).catch((erro) => {
                console.log(erro)
            })


        }




</script>
