<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/cadstyle.css">
    <link rel="icon" href="../assets/imgs/logo.png">
    <title>Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="quadrados">
        <div class="union">
            <img src="../assets/imgs/Union.png" alt="" class="union-normal">
            <img src="../assets/imgs/union-bright.png" alt="" class="union-bright">
        </div>
    </div>
    <main id="gira">
        <div class="esquerda">
            <div class="seta" onclick="history.back()">
                <img src="../assets/imgs/seta.png" alt="">
            </div>
            <div class="logo" onclick="virar()">
                <img src="../assets/imgs/logo.png" alt=""
                    class="icone">
                <div class="crypto">CryptoSight</div>
            </div>
        </div>
        <div class="direita">
            <div class="titulo" id="bvindo">Bem-vindo de volta</div>
            <div class="form">

                <label class="campos esq">
                    <span class="campo">CNPJ:</span>
                    <input type="text" id="cnpj_input" placeholder="Digite seu CNPJ..">
                </label>
                <label class="campos dir">
                    <span class="campo">Senha:</span>
                    <input type="password" id="senha_input" placeholder="Digite sua senha..">
                </label>
                <div class="conta">Ainda não possui uma <a href="cadastroEmpresa.html">conta</a>?</div>

                <button class="submit" onclick="entrar()">ENTRAR</button>
            </div>
        </div>
    </main>
</body>

</html>

<script src="../js/animations.js"></script>

<script>
    if (window.innerWidth <= 1024) {
        function virar() {
            gira.style.transform = "rotateY(180deg)";
        }
    }

    function entrar() {
        /*    aguardar(); */

        var cnpjVar = cnpj_input.value;
        var senhaVar = senha_input.value;

        if (cnpjVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Preencha todos os campos";
            /*   finalizarAguardar(); */
            return false;
        }
        /*  else {
             setInterval(sumirMensagem, 5000)
         } */

        console.log("FORM LOGIN: ", cnpjVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/empresas/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                cnpjServer: cnpjVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
              
                    sessionStorage.ID_EMPRESA = json.id;
                    sessionStorage.CNPJ_EMPRESA = json.cnpj;
                    sessionStorage.NOME_FANTASIA = json.nomeFantasia;

                    setTimeout(function () {
                        window.location = "dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    /*       finalizarAguardar(texto); */
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
    /* 
        function sumirMensagem() {
            cardErro.style.display = "none"
        } */

</script>
