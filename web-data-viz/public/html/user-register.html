    <main class="flex-1 p-10">

        <div class="flex items-center justify-center mb-10">

        <div class="mb-8 flex justify-between">

        <p id="vazio" class="hidden text-center text-[#A0B5AC] py-10">Nenhum usuário encontrado.</p>

        <dialog id="modal_adicionar" class="w-full p-15 m-auto max-w-xl bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">
            <h2 class="text-2xl text-white font-bold pb-10">Novo usuário</h2>
            <div>
                <label class="text-white">Nome Completo</label>
                <input id="iptnome" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">CPF</label>
                <input type="text" id="iptcpf" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Cargo</label>
                <select name="" id="iptcargo" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
                      <option value="" disabled selected hidden></option>
                      <option value="Superadmin">SuperAdmin</option>
                      <option value="Administrador">Administrador</option>

                    </select>
                
            </div>

            <div>

            <div class="flex justify-between">
                <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold" onclick="modal_adicionar.close() ; adicionar()">CADASTRAR</button>
                <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer transition-colors" onclick="modal_adicionar.close()">CANCELAR</button>
            </div>

        </dialog>


        <dialog id="modal_editar" class="w-full p-15 m-auto max-w-xl bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">
            <h2 class="text-2xl text-white font-bold pb-10">Editar usuário</h2>
            <div>
                <label class="text-white">Nome Completo</label>
                <input id="iptnomeeditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">CPF</label>
                <input type="text" id="iptcpfeditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">Cargo</label>
                <input type="text" id="iptcargoeditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div>
                <label class="text-white">E-Mail</label>
                <input type="text" id="iptemaileditado" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div class="flex justify-between">
                <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold" onclick="modal_editar.close() ; editar()">CADASTRAR</button>
                <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer transition-colors" onclick="modal_editar.close()">CANCELAR</button>
            </div>

        </dialog>

        <dialog id="modal_farms" class="w-full p-15 m-auto max-w-xl bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">
            <h2 class="text-2xl text-white font-bold pb-10">Atribuir farms</h2>
            <div id="listafarms"></div>

            <div class="flex justify-between">
                <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold" onclick="salvarfarms()">SALVAR</button>
                <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer transition-colors" onclick="modal_farms.close()">CANCELAR</button>
            </div>
        </dialog>

        <dialog id="modal_excluir" class="m-auto max-w-xl p-5 bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">

                    <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer" onclick="modal_excluir.close()">CANCELAR</button>

        <dialog id="modal_jira" class="w-full p-15 m-auto max-w-xl bg-[#0C1F19] border border-[#207F70]/60 rounded-2xl backdrop:backdrop-blur-sm">

                Integração com Jira
            </h2>
            <a href="../assets/docs/jiratutorial.pdf" download="Tutorial-Jira.pdf" class="flex items-center gap-4 mb-6 p-4 rounded-xl bg-[#144840]/50  hover:bg-[#144840] transition-colors cursor-pointer">
                <i class="fa-solid fa-file-pdf text-3xl text-[#00E6A6]"></i>
                <div>
                    <p class="text-white text-sm font-bold">Como gerar a URL e o token</p>
                    <p class="text-xs text-gray-400">Baixe o passo a passo em PDF</p>
                </div>
                <i class="fa-solid fa-download ml-auto text-[#00E6A6]"></i>
            </a>

            <div class="mb-4">
                <label class="text-white">URL do Jira</label>
                <input id="ipturljira" class="w-full bg-[#101b18] text-white px-3 py-2 rounded-xl border border-[#207F70]/60">
            </div>

            <div class="mb-2">
                <label class="text-white">Token do Jira</label>
                <div class="relative">
                    <input id="ipttokenjira" type="password" class="w-full bg-[#101b18] text-white px-3 py-2 pr-10 rounded-xl border border-[#207F70]/60">
                </div>
            </div>

            <div class="flex justify-between items-center">
                <div class="flex gap-3">
                    <button class="p-3 mt-5 text-white bg-[#00E6A6] rounded-2xl font-bold cursor-pointer" onclick="salvarJira()">
                       SALVAR
                    </button>
                </div>
                <button class="p-3 mt-5 rounded-2xl border border-[#207F70]/60 text-[#A0B5AC] hover:text-white font-bold cursor-pointer transition-colors" onclick="modal_jira.close()">
                    CANCELAR
                </button>
            </div>
        </dialog>

    </div>

    <script>
    
        var idsolicitante = sessionStorage.ID_USUARIO
        var cargologado = sessionStorage.CARGO_USUARIO
        var idempresa = sessionStorage.ID_EMPRESA

        let usuarios = []
        let idselecionado = null

        // ficar mais facil pro back dps troca os mockado
        // let idusuario = 1
        let farms = [];
        let farmsempresa = []

        

        function buscar(){
           let texto = inputbusca.value.toLowerCase();
            let itens = document.querySelectorAll('.usuario');
            let visiveis = 0;

            for (let i = 0; i < itens.length; i++) {

                if (itens[i].textContent.toLowerCase().includes(texto)) {
                    itens[i].style.display = "";
                    visiveis++;
                } else {
                    itens[i].style.display = "none";
                }
            }
            vazio.style.display = visiveis > 0 ? "none" : "block";
        }

        function carregarFarmsDoBanco(idUsuario) {
            fetch(`/farms/list/${idempresa}`)
                .then( (resposta) => {
                    if(resposta.ok){
                        resposta.json().then( (dadosFarms) => {
                        farmsempresa = dadosFarms;
                        fetch(`/usuarios/${idUsuario}/farms`)
                            .then( (resposta2) => {
                                if(resposta2.ok){
                                    resposta2.json().then( (farmsDoUsuario) => {
                                    farms = [];
                                    for (let i = 0; i < dadosFarms.length; i++) {
                                        let possuiFarm = false;

                                        for (let j = 0; j < farmsDoUsuario.length; j++) {
                                            if (farmsDoUsuario[j].id_farm == dadosFarms[i].id) {
                                                possuiFarm = true;
                                                break;
                                            }
                                        }
                                    farms.push({
                                        id: dadosFarms[i].id,
                                        nome: dadosFarms[i].nome,
                                        tem: possuiFarm
                                    });
                                }
                            desenharfarms();
                            modal_farms.showModal();
                        });
                        }})
                    })
                    }}).catch( (erro) => {
                    console.error(erro);
                });
        }

      function carregarFarmsDoBanco(idUsuario) {
            fetch(`/farms/list/${idempresa}`)
                .then( (resposta) => {
                    if (resposta.ok) {
                        resposta.json().then( (dadosFarms) => {
                            farmsempresa = dadosFarms;
                            
                            fetch(`/usuarios/${idUsuario}/farms`)
                                .then( (resposta2) => {
                                    if (resposta2.ok) {
                                        resposta2.json().then( (farmsDoUsuario) => {
                                            farms = [];
                                            for (let i = 0; i < dadosFarms.length; i++) {
                                                let possuiFarm = false;

                                                for (let j = 0; j < farmsDoUsuario.length; j++) {
                                                    if (farmsDoUsuario[j].id == dadosFarms[i].id) {
                                                        possuiFarm = true;
                                                        break;
                                                    }
                                                }

                                                farms.push({
                                                    id: dadosFarms[i].id,
                                                    nome: dadosFarms[i].nome,
                                                    tem: possuiFarm
                                                });
                                            }
                                            desenharfarms();
                                            modal_farms.showModal();
                                        });
                                    }
                                });
                        });
                    }
                })
                .catch( (erro) => {
                    console.error(erro);
                });
        }

        function carregarFarmsDoUsuarioNaLista(idUsuario) {
            fetch(`/farms/list/${idempresa}`)
                .then( (resposta) => {
                    if (resposta.ok) {
                        resposta.json().then( (dadosFarms) => {
                            farmsempresa = dadosFarms;

                            fetch(`/usuarios/${idUsuario}/farms`)
                                .then( (resposta2) => {
                                    if (resposta2.ok) {
                                        resposta2.json().then( (farmsDoUsuario) => {
                                            let nomes = [];

                                            for (let i = 0; i < dadosFarms.length; i++) {
                                                for (let j = 0; j < farmsDoUsuario.length; j++) {
                                                    if (farmsDoUsuario[j].id_farm == dadosFarms[i].id || farmsDoUsuario[j].id == dadosFarms[i].id || farmsDoUsuario[j].idFarm == dadosFarms[i].id) {
                                                        nomes.push(dadosFarms[i].nome);
                                                        break;
                                                    }
                                                }
                                            }

                                            let elemento = document.getElementById(`farmsusuario_${idUsuario}`);
                                            elemento.textContent = nomes.length > 0 ? nomes.join(', ') : 'Nenhuma farm';
                                            
                                        });
                                    }
                                });
                        });
                    }
                })
                .catch( (erro) => {
                    console.error(erro);
                });
        }
        // function abrirfarms() {
        //     desenharfarms()
        //     modal_farms.showModal()
        // }

        function abrirfarms(idUsuario) {
            idselecionado = idUsuario;
            carregarFarmsDoBanco(idUsuario);
        }

        function desenharfarms() {
            listafarms.innerHTML = ""
            for (let i = 0; i < farms.length; i++) {
                let icone = 'fa-regular fa-square'
                if (farms[i].tem) {
                    icone = 'fa-solid fa-square-check text-[#00E6A6]'
                }
                listafarms.innerHTML += `<button type="button" onclick="marcarfarm(${i})" class="flex items-center gap-4 text-white py-2 cursor-pointer">
                            <i class="${icone}"></i> ${farms[i].nome}
                         </button>`
            }
        }

        function marcarfarm(i) {
            farms[i].tem = !farms[i].tem
            desenharfarms()
        }

        
        function salvarfarms() {
            let idsFarmsSelecionadas = []
            for (let i = 0; i < farms.length; i++) {
                if (farms[i].tem) {
                    idsFarmsSelecionadas.push(farms[i].id)
                }
            }

            fetch(`/usuarios/${idselecionado}/farms`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ farms: idsFarmsSelecionadas })
            })
            .then((resposta) => {
                if (resposta.ok) {
                    mostrarfarms()
                    modal_farms.close()
                } else {
                    resposta.text().then((texto) => {
                        alert(texto || 'Erro ao salvar farms')
                    })
                }
            })
            .catch((erro) => {
                console.error(erro)
                alert('Erro de conexão')
            })
        }

        function mostrarfarms() {
            let nomes = ''
            for (let i = 0; i < farms.length; i++) {
                if (farms[i].tem) {
                    if (nomes != '') {
                        nomes += ', '
                    }
                    nomes += farms[i].nome
                }
            }
            if (nomes == '') {
                nomes = 'Nenhuma farm'
            }
            if(document.getElementById(`farmsusuario_${idselecionado}`)) {
                document.getElementById(`farmsusuario_${idselecionado}`).textContent = nomes;
            }
        }

        
        if (!idsolicitante || (cargologado != 'SuperAdmin' && cargologado != 'Administrador')) {
            alert('Acesso restrito a administradores.')
            window.location = 'login.html'
        } else {
            carregar()
        }

        function esc(texto) {
            let div = document.createElement('div')
            div.textContent = texto == null ? '' : texto
            return div.innerHTML
        }

        function formatarcpf(cpf) {
            return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4')
        }

        function carregar() {
            fetch(`/usuarios/listar/${idsolicitante}`)
                .then(function (resposta) {
                    if (!resposta.ok) {
                        throw 'Erro ao listar usuários'
                    }
                    return resposta.json()
                })
                .then(function (dados) {
                    usuarios = dados
                    if (usuarios.length == 0) {
                        vazio.style.display = "block";
                        return;
                    }
                    vazio.style.display = "none"
                    desenhar()
                })
                .catch(function (erro) {
                    console.log(erro, "Não foi possível carregar os usuários")
                    // alert('Não foi possível carregar os usuários.')
                })
        }

        function desenhar() {
            let html = ''

            for (let i = 0; i < usuarios.length; i++) {
                let u = usuarios[i]
                let cargo = u.cargo == 'SuperAdmin' ? 'Super Admin' : u.cargo

                // coloquei que o super admin não pode ser excluido -YasminEloitaNascimento
                let botoes = `<button onclick="abrirfarms()" title="Atribuir farms" class="px-5 py-2.5 rounded-lg bg-[#144840] border border-[#207F70]/40 hover:bg-[#1a5e54] text-[#00E6A6] text-sm cursor-pointer"><i class="fa-solid fa-warehouse"></i></button>`
                if (u.cargo != 'SuperAdmin') {
                    botoes += `
                    <button onclick="abrirEditar(${u.id})" class="px-5 py-2.5 rounded-lg bg-[#144840] border border-[#207F70]/40 hover:bg-[#1a5e54] text-[#00E6A6] text-sm cursor-pointer">Editar</button>
                    <button onclick="abrirExcluir(${u.id})" class="px-5 py-2.5 rounded-lg bg-[#7A0015]/39 border border-[#E00027] hover:bg-red-900 text-red-400 text-sm cursor-pointer">Excluir</button>`
                }

                
                // let idfarm = i == 0 ? 'id="farmsusuario"' : ''

                html += `
            <div class="usuario bg-[#0C1F19] border border-[#207F70] rounded-2xl p-5 flex gap-10">

                <div class="flex items-center gap-4 flex-1">

                    <div>
                        <div>
                            <span class="text-white">${esc(u.nome)}</span>
                            <span class="bg-[#144840] text-[#00E6A6] px-3 py-1 rounded-lg text-xs border border-[#207F70]">${esc(cargo)}</span>
                        </div>
                        <p class="text-sm text-gray-400">${esc(u.email)}</p>
                        <p id ="farmsusuario_${u.id}" class="text-xs text-gray-400">Nenhuma farm</p>
                    </div>
                </div>

                <div class="flex gap-10 items-center">
                    <div>
                        <p class="text-xs text-gray-400">CPF</p>
                        <p class="text-white">${esc(formatarcpf(u.cpf))}</p>
                    </div>

                    <div>
                        <p class="text-xs text-gray-400">Criação</p>
                        <p class="text-white">${esc(u.criacao)}</p>
                    </div>
                </div>

                <div class="flex gap-4">${botoes}
                </div>
            </div>`
            }

            lista.innerHTML = html

            setTimeout( () => {
                for (let i = 0; i < usuarios.length; i++) {
                carregarFarmsDoUsuarioNaLista(usuarios[i].id);
            }
            } , 50 )
            
            buscar()
        }

        function buscarusuario(id) {
            for (let i = 0; i < usuarios.length; i++) {
                if (usuarios[i].id == id) {
                    return usuarios[i]
                }
            }
        }

        function validar(nome, cpf, cargo, email) {
            if (nome == '' || cpf == '' || cargo == '' || email == '') {
                alert('Preencha todos os campos')
                return false
            }
            if (cpf.length != 11 || isNaN(cpf)) {
                alert('CPF precisa ter 11 números')
                return false
            }
            if (email.indexOf('@') == -1) {
                alert('E-mail inválido')
                return false
            }
            return true
        }

       
        function adicionar(){
            let nome = iptnome.value.trim()
            let cpf = iptcpf.value.trim()
            let cargo = iptcargo.value.trim()
            let email = iptemail.value.trim()

            if (!validar(nome, cpf, cargo, email)) {
                return
            }

            fetch('/usuarios/cadastrarPendente', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nome: nome,
                    cpf: cpf,
                    cargo: cargo,
                    email: email,
                    idSolicitante: idsolicitante
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    iptnome.value = ''
                    iptcpf.value = ''
                    iptcargo.value = ''
                    iptemail.value = ''
                    carregar()
                } else {
                    resposta.text().then(function (texto) {
                        alert(texto)
                    })
                }
            }).catch(function (erro) {
                console.log(erro)
                alert('Erro de conexão')
            })
        }

      
        function abrirEditar(id) {
            let u = buscarusuario(id)
            idselecionado = id
            iptnomeeditado.value = u.nome
            iptcpfeditado.value = u.cpf
            iptcargoeditado.value = u.cargo
            iptemaileditado.value = u.email
            modal_editar.showModal()
        }

        function editar(){
            let nome = iptnomeeditado.value.trim()
            let cpf = iptcpfeditado.value.trim()
            let cargo = iptcargoeditado.value.trim()
            let email = iptemaileditado.value.trim()

            if (!validar(nome, cpf, cargo, email)) {
                return
            }

            fetch(`/usuarios/${idselecionado}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nome: nome,
                    cpf: cpf,
                    cargo: cargo,
                    email: email,
                    idSolicitante: idsolicitante
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    carregar()
                } else {
                    resposta.text().then(function (texto) {
                        alert(texto)
                    })
                }
            }).catch(function (erro) {
                console.log(erro)
                alert('Erro de conexão')
            })
        }

       
        function abrirExcluir(id) {
            idselecionado = id
            modal_excluir.showModal()
        }

        function excluir(){
            fetch(`/usuarios/${idselecionado}?idSolicitante=${idsolicitante}`, {
                method: 'DELETE'
            }).then(function (resposta) {
                if (resposta.ok) {
                    carregar()
                } else {
                    resposta.text().then(function (texto) {
                        alert(texto)
                    })
                }
            }).catch(function (erro) {
                console.log(erro)
                alert('Erro de conexão')
            })
        }



        // jogar as 2 funcoes de baixo para a tela final
        
        function abrirJira() {
            modal_jira.showModal();
        }




        function salvarJira() {
            let url_jira = ipturljira.value;
            let token_jira = ipttokenjira.value;

            if (!url_jira || !token_jira) {
                alert('Preencha a URL e o token do Jira.');
                return;
            }

            fetch('/empresas/salvarjira', { method: 'PUT', headers: { 'Content-Type': 'application/json'},
                body: JSON.stringify({
                    idempresa: idempresa,
                    url_jira: url_jira,
                    token_jira: token_jira
                })
            })
            .then( (resposta) => {
            if(resposta.ok){
                    resposta.json().then( dados => {
                        alert("jira cadastrado")
                        ipttokenjira.value = '';
                        modal_jira.close();
                    })
            }else{
                alert("teste")
            }}).catch( (erro) => {
                console.error(erro);
            });
        }


        

    </script>
